<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Lovable App</title>
    <meta name="description" content="Lovable Generated Project" />
    <meta name="author" content="Lovable" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Lovable App" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!--
      Fonts load here, not via @import in index.css.

      That @import sat after the three @tailwind directives, which CSS does
      not allow: @import must precede all other rules. Vite dropped it
      silently in BOTH dev and the production build, so Bebas Neue and Inter
      never loaded at all and every surface fell back to system sans-serif.
      It had been in that position since the line was first added, so the
      display face has never once rendered.

      <link> also beats @import on speed even when the ordering is legal: an
      @import cannot begin fetching until the stylesheet containing it has
      been downloaded and parsed, serialising two round trips. preconnect
      opens the TLS connections to both Google hosts up front, since the CSS
      and the font files come from different origins.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <!--
      Pre-mount paint. Login uses window.location.href, a hard document
      reload, so the browser paints an empty #root before React exists. No
      component-level loading state can cover that gap.

      This has to be inline rather than left to index.css because in dev
      Vite serves no stylesheet link at all: index.css is imported by
      main.tsx and injected by JavaScript, so body's bg-background does not
      apply until the bundle boots. The production build does emit a
      render-blocking <link>, where the stylesheet alone would be enough.
      Inline covers both.

      #0A0A0A is the literal value of --background (0 0% 4%), duplicated on
      purpose so this matches what the stylesheet sets and there is no shift
      when it loads. Keep the two in sync.
    -->
    <style>
      html {
        color-scheme: dark;
      }
      html,
      body {
        background-color: #0a0a0a;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
